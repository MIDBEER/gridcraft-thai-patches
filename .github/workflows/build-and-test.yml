name: Build and test

# Builds upstream GridCraft twice on Windows, as it is and with every patch in patches/ applied, runs the
# tests, and uploads both builds so the Thai rendering can be compared side by side. Nothing here uses
# secrets or publishes anything: the results are workflow artifacts, kept 14 days.
on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Upstream commit, tag or branch to build (empty = the commit the patches were written against)
        type: string
        default: ""
  push:
    branches: [main]
    paths: ["patches/**", "tests/**", "tools/**", ".github/**"]
  pull_request:
    paths: ["patches/**", "tests/**", "tools/**", ".github/**"]

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_REPO: storytold/gridcraft
  # The commit the patches were written against (upstream main on 2026-10-27).
  UPSTREAM_REF: ${{ inputs.upstream_ref || '11bb67386c9bb19b0717e21e98adc608162ae2e5' }}
  # The craft-fonts commit that upstream's ci.yml and release.yml pin. Change it with UPSTREAM_REF if upstream moves it.
  CRAFT_FONTS_REF: b076417b5880bd4154bd22f00695b1d28c6bea83
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUST_BACKTRACE: "1"

jobs:
  test:
    name: Theme tests, patched
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
      CRAFT_FONTS_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-upstream
        with:
          upstream-repo: ${{ env.UPSTREAM_REPO }}
          upstream-ref: ${{ env.UPSTREAM_REF }}
          craft-fonts-ref: ${{ env.CRAFT_FONTS_REF }}
          apply-patches: "true"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: upstream
          shared-key: windows-test
      # Every test under theme:: (fonts and fallbacks), which includes the ones the patches add. The full
      # upstream gate is the separate "Upstream gate" workflow.
      - name: Run theme tests
        working-directory: upstream
        run: cargo test --locked -p gridcraft-ui-egui --lib 'theme::'

  build:
    name: Build (${{ matrix.variant }})
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [upstream, patched]
    env:
      CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
      CRAFT_FONTS_REQUIRED: "1"
      # Same as upstream's packaging/windows/package.ps1: static CRT, so no VC++ redistributable is needed.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-upstream
        with:
          upstream-repo: ${{ env.UPSTREAM_REPO }}
          upstream-ref: ${{ env.UPSTREAM_REF }}
          craft-fonts-ref: ${{ env.CRAFT_FONTS_REF }}
          apply-patches: ${{ matrix.variant == 'patched' }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: upstream
          shared-key: windows-release
      - name: Build gridcraft and gridcraft-cli
        working-directory: upstream
        run: cargo build --release --locked -p gridcraft -p gridcraft-cli --target x86_64-pc-windows-msvc
      - name: Collect the build
        shell: pwsh
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          $name = "gridcraft-windows-x64-$env:VARIANT"
          $dir = Join-Path 'dist' $name
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $bin = 'upstream\target\x86_64-pc-windows-msvc\release'
          Copy-Item "$bin\gridcraft.exe", "$bin\gridcraft-cli.exe" $dir

          # The binaries embed craft-fonts faces, so their licences travel with them (as upstream's packaging does).
          Copy-Item upstream\LICENSE-MIT, upstream\LICENSE-APACHE, upstream\NOTICE $dir
          foreach ($ofl in Get-ChildItem 'craft-fonts\fonts\*\OFL.txt' -ErrorAction SilentlyContinue) {
            Copy-Item $ofl.FullName (Join-Path $dir ('OFL-' + $ofl.Directory.Name + '.txt'))
          }

          $version = (& "$dir\gridcraft-cli.exe" --version)
          if ($LASTEXITCODE -ne 0) { throw 'gridcraft-cli --version failed' }
          $sha = (git -C upstream rev-parse HEAD)
          $applied = if ($env:VARIANT -eq 'patched') {
            (Get-ChildItem patches\*.patch | ForEach-Object { '  ' + $_.Name + '  sha256 ' + (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() }) -join "`n"
          } else { '  (none: plain upstream)' }
          @(
            'UNOFFICIAL TEST BUILD. Not an ArtCraft release, not signed, not supported by the ArtCraft team.',
            '',
            "variant:     $env:VARIANT",
            "version:     $version",
            "upstream:    $env:UPSTREAM_REPO @ $sha",
            "craft-fonts: storytold/craft-fonts @ $env:CRAFT_FONTS_REF",
            'patches:',
            $applied,
            "built:       $((Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm')) UTC by $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID",
            '',
            'GridCraft is dual-licensed MIT OR Apache-2.0 (LICENSE-MIT, LICENSE-APACHE). Fonts: OFL-*.txt.'
          ) | Set-Content -Path (Join-Path $dir 'BUILD-INFO.txt') -Encoding utf8
          Get-Content (Join-Path $dir 'BUILD-INFO.txt')
      - uses: actions/upload-artifact@v4
        with:
          name: gridcraft-windows-x64-${{ matrix.variant }}
          path: dist/gridcraft-windows-x64-${{ matrix.variant }}
          if-no-files-found: error
          retention-days: 14

  # Best effort: opens the same Thai workbook in both builds on the runner and saves before/after screenshots.
  # The runner has no GPU (wgpu falls back to a software adapter) and its fonts differ from a desktop PC, so a
  # failure or a blank image here says nothing about the patch. The real check is to download the two builds
  # and look at them on a normal PC (see README).
  screenshots:
    name: Before/after screenshots (best effort)
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install openpyxl pillow
      - uses: actions/download-artifact@v4
        with:
          pattern: gridcraft-windows-x64-*
          path: bin
      - name: Take screenshots
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path shots | Out-Null
          python tests\workbooks\make_fonttest_sizes.py shots\thai.xlsx
          $xlsx = (Resolve-Path shots\thai.xlsx).Path
          foreach ($v in 'upstream', 'patched') {
            $exe = (Resolve-Path "bin\gridcraft-windows-x64-$v\gridcraft.exe").Path
            .\tools\shot_gridcraft.ps1 -Exe $exe -File $xlsx -Out "shots\$v.png" -WaitSec 25
          }
          python tools\compare_shots.py shots\upstream.png shots\patched.png shots\compare.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots
          if-no-files-found: warn
          retention-days: 14
